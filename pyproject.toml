[project]
name = "pokearena"
version = "0.1.0"
description = "A simplified Pokémon battle environment for high-throughput simulation, search and RL"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "rich>=15.0.0",
]

[project.scripts]
pokearena = "pokearena.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokearena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
